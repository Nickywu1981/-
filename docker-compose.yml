version: "3.8"

services:
  # ============ MySQL 8.0 ============
  mysql:
    image: mysql:8.0
    container_name: ai-saas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?生产环境必须设置DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_saas
      MYSQL_USER: ${DB_USER:?生产环境必须设置DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?生产环境必须设置DB_PASSWORD}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  # ============ Redis 7 ============
  redis:
    image: redis:7-alpine
    container_name: ai-saas-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?生产环境必须设置REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  # ============ Express Server ============
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-saas-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3001"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-ai_saas}
      DB_PASSWORD: ${DB_PASSWORD:-ai_saas_pass}
      DB_NAME: ai_saas
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ai_saas_redis}
      JWT_SECRET: ${JWT_SECRET:?生产环境必须设置JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?生产环境必须设置JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?生产环境必须设置ENCRYPTION_KEY且必须为32字符}
      JWT_EXPIRES_IN: 7d
      MOCK_ENABLED: ${MOCK_ENABLED:-true}
      UPLOAD_DIR: /app/uploads
      # MinIO / S3 存储配置（兼容 COS 协议）
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}   # local | minio | cos
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ai-saas
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?生产环境必须设置S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?生产环境必须设置S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - server_uploads:/app/uploads
      - ./server/src:/app/src:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============ MinIO 对象存储（兼容 S3/COS） ============
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: ai-saas-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?生产环境必须设置MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?生产环境必须设置MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  # ============ Nuxt3 Client ============
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: ${CLIENT_TARGET:-dev}
    container_name: ai-saas-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NUXT_PUBLIC_API_BASE: http://localhost:3001/api
    volumes:
      - ./client/pages:/app/pages:ro
      - ./client/components:/app/components:ro
      - ./client/layouts:/app/layouts:ro
      - ./client/composables:/app/composables:ro
      - ./client/assets:/app/assets:ro
      - ./client/public:/app/public:ro
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:
  minio_data:
  server_uploads:
