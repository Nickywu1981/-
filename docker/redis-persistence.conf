# Redis 持久化配置文件
# 用于 Docker Compose 挂载: ./redis-persistence.conf:/usr/local/etc/redis/redis.conf

# ==================== 内存管理 ====================
maxmemory 2gb
maxmemory-policy allkeys-lru

# ==================== RDB 快照持久化 ====================
# 格式: save <seconds> <changes>
# 以下规则满足任意一条即触发 RDB 快照
save 900 1       # 15分钟内至少1个key变化
save 300 10      # 5分钟内至少10个key变化
save 60 10000    # 1分钟内至少10000个key变化

# RDB 文件名和路径
dbfilename dump.rdb
dir /data

# 快照失败时停止写入（数据安全优先）
stop-writes-on-bgsave-error yes
# 压缩 RDB 文件
rdbcompression yes
# 校验和
rdbchecksum yes

# ==================== AOF 追加持久化 ====================
appendonly yes
appendfilename "appendonly.aof"

# AOF 同步策略: everysec（每秒同步，性能与安全平衡）
# - always: 每个写命令同步（最安全但最慢）
# - everysec: 每秒同步一次（推荐）
# - no: 由操作系统决定（最快但最不安全）
appendfsync everysec

# AOF 自动重写（防止文件无限增长）
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# AOF 重写时允许追加
no-appendfsync-on-rewrite no

# ==================== 慢查询日志 ====================
slowlog-log-slower-than 10000  # 超过10ms记录
slowlog-max-len 128

# ==================== 连接 ====================
timeout 300
tcp-keepalive 60

# ==================== 安全 ====================
# 生产环境必须设置密码
# requirepass ${REDIS_PASSWORD}

# 禁止危险命令（生产环境建议启用）
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
