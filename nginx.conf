# Nginx 反向代理配置（增强版）
# 部署路径: /etc/nginx/sites-available/ai-saas
# 增强项: Brotli 压缩 / IP 黑白名单 / 防爬虫 / CSP 安全头

upstream ai_saas_server {
    least_conn;
    server 127.0.0.1:3001 weight=1 max_fails=3 fail_timeout=30s;
}

upstream ai_saas_client {
    server 127.0.0.1:3000;
}

# IP 白名单 (管理后台敏感接口)
geo $admin_allowed {
    default 0;
    # 办公 VPN / 家庭 IP
    # 192.168.1.0/24 1;   # 内网
    # 1.2.3.4 1;          # 管理员公网 IP
    127.0.0.1 1;
}

# 恶意 UA 黑名单 (爬虫/扫描器)
map $http_user_agent $block_ua {
    default 0;
    "~*scrapy"     1;
    "~*sqlmap"     1;
    "~*nmap"       1;
    "~*nikto"      1;
    "~*acunetix"   1;
    "~*burpsuite"  1;
    "~*masscan"    1;
}

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header          Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Brotli 压缩
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/xml+rss;

    # Gzip 压缩 (回退)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_proxied any;

    # 恶意 UA 拦截
    if ($block_ua = 1) {
        return 444;
    }

    # 基础限流
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 客户端静态资源
    location ^~ /_nuxt/ {
        proxy_pass http://ai_saas_client;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Admin 接口 IP 白名单 + 更严格限流
    location /api/admin/ {
        if ($admin_allowed = 0) {
            return 403;
        }
        proxy_pass http://ai_saas_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api_limit burst=10 nodelay;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://ai_saas_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        client_max_body_size 20m;
        limit_req zone=api_limit burst=20 nodelay;
    }

    # WebSocket
    location /ws {
        proxy_pass http://ai_saas_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 上传文件
    location /uploads/ {
        proxy_pass http://ai_saas_server;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 阻止访问敏感文件
    location ~ /\.(git|env|ht) {
        deny all;
        return 404;
    }

    # 其余请求 → Nuxt SSR
    location / {
        proxy_pass http://ai_saas_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_conn conn_limit 50;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # CSP 安全策略
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
