name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============ Server Tests ============
  server-tests:
    name: Server Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: ./server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: ai_saas_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root123
          DB_NAME: ai_saas_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          JWT_SECRET: ci-test-secret-key-32-chars-min!
          ENCRYPTION_KEY: ci-test-32-byte-key-here!!!!!!
          MOCK_ENABLED: "true"
      - run: npx eslint src/ --max-warnings 0
        continue-on-error: true

  # ============ Client Tests ============
  client-tests:
    name: Client Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
        continue-on-error: true
      - run: npx eslint . --max-warnings 0
        continue-on-error: true

  # ============ Build Check ============
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build server (syntax check)
        working-directory: ./server
        run: npm ci && node -e "import('./src/app.js').then(() => console.log('Server module OK'))"
      - name: Type check client
        working-directory: ./client
        run: npm ci && npx vue-tsc --noEmit
        continue-on-error: true

  # ============ E2E Tests ============
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/

  # ============ Docker Build ============
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t movio-api ./server
      - name: Build client image
        run: docker build -t movio-nuxt ./client
