name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        type: choice
        options: [staging, production]
        default: staging

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      # ── Server build ──
      - name: Install server deps
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Run server tests
        working-directory: server
        run: pnpm test

      # ── Client build ──
      - name: Install client deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Generate Nuxt static
        working-directory: client
        run: pnpm build
        env:
          NODE_ENV: production

      # ── Package artifacts ──
      - name: Package server
        run: |
          mkdir -p dist/server
          cp -r server/src server/package.json server/pnpm-lock.yaml dist/server/
          echo "{}" > dist/server/src/config/env.json

      - name: Package client
        run: |
          mkdir -p dist/client
          cp -r client/.output dist/client/output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: dist/
          retention-days: 7

      # ── Deploy via SSH ──
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/movio
            mkdir -p releases/$(date +%Y%m%d_%H%M%S)
            # Symlink update handled by PM2 graceful reload
            pm2 reload ecosystem.config.cjs --update-env

      # ── Health check ──
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }}/api/health | grep -q 200
