name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        type: choice
        options: [staging, production]
        default: staging

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # ── Server build ──
      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      # ── Client build ──
      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Generate Nuxt static
        working-directory: client
        run: npm run build
        env:
          NODE_ENV: production

      # ── Package artifacts ──
      - name: Package server
        run: |
          mkdir -p dist/server
          cp -r server/src server/package.json server/package-lock.json dist/server/
          echo "{}" > dist/server/src/config/env.json

      - name: Package client
        run: |
          mkdir -p dist/client
          cp -r client/.output dist/client/output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: dist/
          retention-days: 7

      # ── Deploy via SSH ──
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: dist/

      - name: Copy and deploy to server
        uses: appleboy/scp-action@v0.1.9
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: dist/
          target: /opt/movio/releases/$(date +%Y%m%d_%H%M%S)/

      - name: Reload application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/movio
            pm2 reload ecosystem.config.cjs --update-env

      # ── Health check ──
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }}/api/health | grep -q 200
