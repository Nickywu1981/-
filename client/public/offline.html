<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Movio AI — 离线模式</title>
  <meta name="theme-color" content="#5b5fe3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #faf5ff 100%);
      display: flex; align-items: center; justify-content: center;
      color: #1e293b;
    }
    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 20px; padding: 48px 36px;
      max-width: 420px; width: 90%; text-align: center;
      box-shadow: 0 4px 32px rgba(91,95,227,0.12), 0 1px 4px rgba(0,0,0,0.06);
    }
    .icon {
      width: 72px; height: 72px; margin: 0 auto 24px;
      background: linear-gradient(135deg, #5b5fe3, #a5a9f0); border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 36px; height: 36px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
    p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 20px; }
    .retry-btn {
      display: inline-block; padding: 10px 28px;
      background: linear-gradient(135deg, #5b5fe3, #a5a9f0);
      color: #fff; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
    }
    .retry-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(91,95,227,0.3); }
    .retry-btn:active { transform: translateY(0); }
  </style>
  <script>
    window.addEventListener('online', () => location.reload());
    const pollTimer = setInterval(() => { if (navigator.onLine) { clearInterval(pollTimer); location.reload(); } }, 5000);
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.33 9"/>
        <path d="M1.67 9a16 16 0 0 1 12.43-3.72"/>
      </svg>
    </div>
    <h1>当前处于离线状态</h1>
    <p>Movio AI 需要网络连接才能使用完整功能。<br>请检查您的网络连接后重试。</p>
    <button class="retry-btn" onclick="location.reload()">重新连接</button>
    <p class="hint">网络恢复后将自动刷新页面</p>
  </div>
</body>
</html>
